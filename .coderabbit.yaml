# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  profile: assertive
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
    auto_incremental_review: false
  # cubic writes the PR summary, so CodeRabbit leaves it out.
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  pre_merge_checks:
    # CodeRabbit does not count the OCaml `(* ... *)` comments above our
    # functions as docstrings, so this check misfires on nearly every PR.
    docstrings:
      mode: "off"
